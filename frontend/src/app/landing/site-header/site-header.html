<header class="header">
  <div class="container header__inner">
    <a class="brand" routerLink="/" fragment="top" aria-label="GymFlow home">
      <app-icon name="dumbbell" [strokeWidth]="2.2" />
      <span>Gym<em>Flow</em></span>
    </a>

    <nav class="nav" [class.nav--open]="menuOpen()" aria-label="Primary">
      @for (link of links; track link.fragment; let first = $first) {
        <a
          class="nav__link"
          [class.nav__link--active]="first"
          routerLink="/"
          [fragment]="link.fragment"
          (click)="menuOpen.set(false)"
          >{{ link.label }}</a
        >
      }
      <div class="nav__actions">
        <a class="btn btn--outline btn--sm" href="#">Login</a>
        <button class="btn btn--primary btn--sm" type="button" (click)="openRegister()">Get Started</button>
      </div>
    </nav>

    <button
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation"
      (click)="menuOpen.update((open) => !open)"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
    </button>
  </div>
</header>
