<section class="hero" id="top">
  <div class="container hero__inner">
    <div class="hero__copy">
      <span class="eyebrow enter" style="--enter-delay: 150ms">Smart Gym Management</span>
      <h1>
        <span class="enter" style="--enter-delay: 250ms">Manage Your Gym</span>
        <em class="enter" style="--enter-delay: 400ms">The Smart Way</em>
      </h1>
      <p class="hero__lead enter" style="--enter-delay: 550ms">
        Members, membership plans, payments, attendance and reports — all in one simple platform.
      </p>

      <div class="hero__actions enter" style="--enter-delay: 700ms">
        <button class="btn btn--primary" type="button" (click)="registerDialog.open()">
          Get Started <app-icon name="arrow-right" />
        </button>
        <button class="btn btn--outline" type="button" (click)="registerDialog.open()">
          <app-icon name="play" /> See Demo
        </button>
      </div>

      <ul class="hero__highlights">
        @for (item of highlights; track item; let i = $index) {
          <li class="enter" [style.--enter-delay.ms]="900 + i * 120"><app-icon name="check" />{{ item }}</li>
        }
      </ul>
    </div>

    <div class="hero__visual">
      <app-dashboard-preview />
    </div>
  </div>
</section>
